# Caddy compartilhado por todos os apps da VPS. Sobe uma vez:
#   docker network create web
#   BASE_DOMAIN=seudominio.com.br docker compose up -d
services:
  caddy:
    image: caddy:2.11.7
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?defina BASE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # fronts estáticos de cada app
      - ../../apps/web/dist:/srv/pots:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
