# Sobe tudo na VPS: docker compose up -d --build
# Antes: copie .env.example para .env e preencha.
services:
  # Na primeira subida (ou numa VPS nova), recupera o banco do backup se ele ainda não existir.
  restore:
    image: litestream/litestream:0.5.17
    command: ["restore", "-if-db-not-exists", "-if-replica-exists", "/data/pots.db"]
    env_file: .env
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/pots.db
    volumes:
      - data:/data
    depends_on:
      restore:
        condition: service_completed_successfully
    restart: unless-stopped

  # Copia o SQLite continuamente para um armazenamento S3 (Cloudflare R2, Backblaze B2...).
  litestream:
    image: litestream/litestream:0.5.17
    command: ["replicate"]
    env_file: .env
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  # HTTPS automático. Serve o front (apps/web/dist, quando existir) e repassa /api para a API.
  caddy:
    image: caddy:2.11.7
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
