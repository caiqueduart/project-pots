# Sobe o Pots na VPS: docker compose up -d --build
# Antes: copie .env.example para .env, crie a rede (docker network create web)
# e suba o proxy compartilhado em deploy/proxy.
services:
  # Na primeira subida (ou numa VPS nova), recupera o banco do backup se ele ainda não existir.
  restore:
    image: litestream/litestream:0.5.17
    command: ["restore", "-if-db-not-exists", "-if-replica-exists", "/data/pots.db"]
    env_file: .env
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    restart: "no"

  api:
    container_name: pots-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/pots.db
    volumes:
      - data:/data
    depends_on:
      restore:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [default, web]

  # Copia o SQLite continuamente para um armazenamento S3 (Cloudflare R2, Backblaze B2...).
  litestream:
    image: litestream/litestream:0.5.17
    command: ["replicate"]
    env_file: .env
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:

# Rede compartilhada com o Caddy da VPS (deploy/proxy). Crie uma vez: docker network create web
networks:
  web:
    external: true
